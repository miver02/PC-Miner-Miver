# PCMiner Fixed Configuration File
# 修复后的挖矿配置文件

# 矿池配置 - 使用Slush Pool (更稳定)
pool_host=stratum.slushpool.com
pool_port=3333
username=12yYM9Mbr4rrRSeptxsr7PVZ3G3gM9MFt6.worker001
password=x

# 挖矿设置
threads=8                    # 使用8个线程 (根据CPU调整)
batch_size=100000           # 减少批处理大小避免内存问题
enable_avx2=true            # 启用AVX2优化
enable_optimization=true    # 启用通用优化

# 网络设置
connect_timeout=30          # 连接超时30秒
retry_delay=10             # 重连延迟10秒
max_retries=5              # 最大重连次数

# 性能设置
benchmark_on_start=false   # 启动时不运行基准测试
stats_interval=10          # 统计更新间隔10秒

